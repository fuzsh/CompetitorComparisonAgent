[project]
name = "competitor-compare"
version = "0.1.0"
description = "Honest competitor comparison table: traceable cells, labeled inferences, flagged gaps."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-pptx>=1.0",
  "typesafe-sdk>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
